<!-- items-grid.component.html -->
<div class="toolbar mt-5">
  <button mat-raised-button color="primary" (click)="create()">
    <mat-icon>add</mat-icon> New
  </button>
  <button
    mat-raised-button
    color="primary"
    matTooltip="Refresh"
    (click)="onRefresh()"
    aria-label="Refresh"
  >
    <mat-icon>refresh</mat-icon>
  </button>

  <span class="flex-1"></span>

  <mat-form-field appearance="outline" class="filter">
    <mat-label>Filter VigyanKendra</mat-label>
    <mat-select (selectionChange)="setVigyanKendraFilter($event)">
      <mat-option
        *ngFor="let vigyanKendra of vigyanKendraList()"
        [value]="vigyanKendra.id"
      >
        {{ vigyanKendra.code }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
<div>
  <span
    >Total Records Count : <b>{{ filteredItems().length }}</b></span
  >
</div>
<div style="height: 600px; width: 100%">
  <ag-grid-angular
    class="ag-theme-alpine"
    [theme]="'legacy'"
    [rowData]="filteredItems()"
    [columnDefs]="columnDefs"
    style="width: 100%; height: 600px"
    rowSelection="single"
    (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>
</div>
