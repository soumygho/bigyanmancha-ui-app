<div class="form-container">
  <!-- item-dialog.component.html -->

  <form [formGroup]="form" (ngSubmit)="save()">
    <h2 mat-dialog-title>{{ title }}</h2>
    <mat-card>
      <mat-card-content>
        <div class="fluid-container">
          <div class="row">
            <div class="col-md-12">
              <!-- Name Field -->
              <mat-form-field appearance="fill" class="full-width">
                <mat-label>Name</mat-label>
                <input
                  matInput
                  formControlName="name"
                  placeholder="Enter Vigyan Kendra name"
                />
                <mat-error *ngIf="form.get('name')?.hasError('required')">
                  Name is required
                </mat-error>
                <mat-error *ngIf="form.get('name')?.hasError('minlength')">
                  Name must be at least 3 characters
                </mat-error>
              </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <!-- Code Field -->
              <mat-form-field appearance="fill" class="full-width">
                <mat-label>Code</mat-label>
                <input
                  matInput
                  formControlName="code"
                  placeholder="Enter Vigyan Kendra Code"
                />
                <mat-error *ngIf="form.get('code')?.hasError('required')">
                  Code is required
                </mat-error>
                <mat-error *ngIf="form.get('code')?.hasError('minlength')">
                  Code must be at least 3 characters
                </mat-error>
              </mat-form-field>
            </div>
          </div>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!form.valid"
          class="me-2"
        >
          Submit
        </button>
        <button
          mat-raised-button
          color="warn"
          type="button"
          (click)="resetForm()"
          class="me-2"
        >
          Reset
        </button>
        <button mat-stroked-button (click)="onCancel()">Cancel</button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
